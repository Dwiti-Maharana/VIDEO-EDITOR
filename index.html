.blk{position:absolute;top:3px;bottom:3px;border-radius:6px;padding:4px 8px;overflow:hidden;white-space:nowrap;font-size:11px;color:#fff;cursor:grab;border:2px solid transparent;user-select:none}

.blk.vid{background:#5a47e8}.blk.txt{background:#e0457b}.blk.mus{background:#0b9d88}

#L,#L *{user-select:none;-webkit-user-select:none}#L textarea,#L input{user-select:text;-webkit-user-select:text}.mbar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.mbar button{flex:1;padding:6px 4px;font-size:12px;white-space:nowrap}.mi.ms{outline:3px solid var(--ac);outline-offset:-3px}.mi .ck{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:2}
.blk.ovb{background:#2c7be5}.row.o{height:40px}.lb .lo{height:40px}.mi .ly{position:absolute;top:4px;right:28px;width:20px;height:20px;border-radius:50%;background:#000c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1;z-index:2;cursor:pointer}.mi .ly:hover{background:var(--ac)}
.row.dz{background:#6d4aff40!important}.row.dz:after{content:'';position:absolute;inset:0;border:2px dashed var(--ac);pointer-events:none}

.emo{display:flex;flex-wrap:wrap;gap:4px}.emo button{font-size:20px;padding:2px 6px}
.blk,#rul{touch-action:none;-webkit-touch-callout:none}
.row.a{height:48px}.lb .la{height:48px}.lb{overflow:hidden}
.wfa{position:absolute;left:0;top:0;width:100%;height:100%;opacity:.95;pointer-events:none}

#mb{display:none}

.tb{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:4px 8px}.tb>*{flex:none}.tb input[type=range]{width:80px}#tm{min-width:92px;font-size:12px}

}

.lb .lo{cursor:pointer}.lb .lo.al{background:var(--ac);color:#fff}.row.o.al{box-shadow:inset 0 0 0 2px var(--ac)}
#xd{position:fixed;inset:0;z-index:90;background:#000a;display:flex;align-items:center;justify-content:center;padding:12px}#xd[hidden]{display:none}
.xb{background:var(--p);border:1px solid var(--bd);border-radius:14px;width:min(840px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 70px #000a;overflow:hidden}
.xh{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);font-weight:700;font-size:15px}.xh span{flex:1}

.xr{flex:1;min-width:0;padding:14px 18px;overflow:auto}.xrw{display:grid;grid-template-columns:120px 1fr auto;gap:8px 10px;align-items:center;margin-bottom:11px}.xrw>label:first-child{color:var(--mu)}
.xr select,.xr input:not([type=checkbox]){width:100%;background:var(--p2);border:1px solid var(--bd);border-radius:6px;padding:7px}.xrw small,.xv{color:var(--mu)}.xck{display:flex;gap:8px;align-items:center}
.xn{color:var(--mu);margin:14px 0 0;font-size:12px}.xf{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--bd);flex-wrap:wrap}.xf #xs{flex:1;min-width:180px;color:var(--mu)}.xf button{padding:8px 16px}
@media(max-width:700px){.xm{flex-direction:column}.xl{width:auto;border-right:0;border-bottom:1px solid var(--bd);display:flex;gap:6px;overflow-x:auto;flex:none}.xl h5{display:none}.xl button{width:auto;white-space:nowrap;margin:0;flex:none}.xrw{grid-template-columns:96px 1fr auto}.xr select,.xr input:not([type=checkbox]){font-size:16px}}
</style></head><body>
<header><span class="logo">◆ ClipForge</span><div id="asp"></div><span style="flex:1"></span>

<div id="stage"><canvas id="cv"></canvas></div>

</main>

<button id="sp" title="Split at playhead (S)">✂ Split</button><button id="du" title="Duplicate">⧉</button><button id="ml" title="Move earlier">◀</button><button id="mr" title="Move later">▶</button><select id="spd" title="Speed of selected clip (slow motion / fast forward)"><option value="0.1">🐢 0.1×</option><option value="0.25">🐢 0.25×</option><option value="0.5">🐢 0.5×</option><option value="0.75">0.75×</option><option value="1" selected>⏱ 1× normal</option><option value="1.25">1.25×</option><option value="1.5">🐇 1.5×</option><option value="2">🐇 2×</option><option value="3">🐇 3×</option><option value="4">🐇 4×</option><option value="6">🐇 6×</option><option value="8">🐇 8×</option><option value="" id="spc" hidden></option></select><button id="de" title="Delete (Del)">🗑 Delete</button><button id="un" title="Undo (Ctrl+Z)">↶ Undo</button><button id="re" title="Redo (Ctrl+Y)">↷</button><button id="snb" class="on" title="Magnetic snapping to playhead and clip edges">🧲 Snap</button><button id="mm" title="Select multiple clips: Ctrl/Shift-click, drag a box, or tap this then tap clips">☑ Multi</button><button id="al" title="Add a layer that can hold video, images, audio and text together">＋ Layer</button>

<script>
const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d');
const S={media:[],clips:[],texts:[],voices:[],music:null,t:0,play:false,sel:null,zoom:60,id:1,tab:'media',curId:null,last:0,multi:[],mm:0};
const ASP={'9:16':[720,1280],'4:5':[720,900],'1:1':[720,720],'16:9':[1280,720]};
const LBL={'9:16':'TikTok · Reels · Shorts','4:5':'Instagram post','1:1':'Square','16:9':'YouTube'};
const DEF={b:100,c:100,s:100,bl:0,g:0,se:0,h:0};
const FX={Original:{},Vivid:{c:115,s:145},'B&W':{g:100,c:110},Vintage:{se:60,c:90,b:105,h:-10},Cool:{h:-20,s:110,b:105},Warm:{h:15,se:25,s:115},Fade:{c:80,b:110,s:80},Dramatic:{c:145,b:90,s:110},Dream:{bl:2,b:112,s:125}};
const TP={'Plain text':{},Title:{size:96,anim:'pop',y:30},Caption:{size:52,bgOn:1,y:80},Subtitle:{size:44,bold:0,y:88,stroke:1},Neon:{size:80,color:'#00ffd5',stroke:1,anim:'fade'},Impact:{size:110,font:'Impact',stroke:1,color:'#ffe600',y:20}};
const FONTS=['Arial','Impact','Georgia','Courier New','Comic Sans MS','Trebuchet MS'];
const EMO='😀 😂 😍 🔥 💯 ❤️ 👍 🎉 ✨ ⭐ 💥 👀 🚀 😎 🙌 🎵'.split(' ');
let W,H,AC,DEST,REC=null,VN=0;
const ALL={},HS={u:[],r:[],cur:''};let HT;
const snap=()=>JSON.stringify({c:S.clips,t:S.texts,v:S.voices,mu:S.music,o:S.ovs,nl:S.nl,na:S.na,nt:S.nt,md:S.media.map(m=>m.id)},(k,v)=>k=='_b'?undefined:v);
function hist(){const s=snap();if(s!==HS.cur){if(HS.cur)HS.u.push(HS.cur);if(HS.u.length>100)HS.u.shift();HS.r=[];HS.cur=s;save()}}const INS={o:null};
const M=id=>S.media.find(m=>m.id==id),esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>{t=Math.max(0,t);return Math.floor(t/60)+':'+(t%60).toFixed(1).padStart(4,'0')};
const total=()=>Math.max(0,S.clips.reduce((a,c)=>a+c.dur,0),...S.voices.map(a=>a.start+adur(a)),...S.texts.map(x=>x.start+x.dur),...S.ovs.map(o=>o.start+odur(o)));
const active=t=>S.clips.find(c=>t>=c.start&&t<c.start+c.dur);
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;bottom:270px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:8px 14px;border-radius:8px;z-index:99';document.body.append(d);setTimeout(()=>d.remove(),2400)}
function setAsp(k){S.asp=k;save();[W,H]=ASP[k];cv.width=W;cv.height=H;fit();$('#asp').innerHTML=Object.keys(ASP).map(a=>`<button class="${a==k?'on':''}" data-a="${a}">${a}<small>${LBL[a]}</small></button>`).join('')}
function fit(){const r=$('#stage').getBoundingClientRect(),k=Math.min((r.width-24)/W,(r.height-24)/H);if(k>0){cv.style.width=W*k+'px';cv.style.height=H*k+'px'}}
new ResizeObserver(fit).observe($('#stage'));
$('#asp').onclick=e=>{const b=e.target.closest('[data-a]');b&&setAsp(b.dataset.a)};
$('#th').onclick=()=>{const d=document.documentElement,c=d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');d.dataset.theme=c=='dark'?'light':'dark';};
document.documentElement.dataset.theme='dark';

const zwImg={};
function zwDraw(){const el=$('#zwc');if(!el||S.exporting)return;const c=getSel();if(!c||!S.sel||S.sel.k!='clip'||c.za!=ZW)return;cw(c);const m=M(c.mid);if(!m)return;const g=el.getContext('2d'),w=el.width,h=el.height;g.fillStyle='#000';g.fillRect(0,0,w,h);

const a=S.zwa?1:0,R=i=>{const f=c[i?'ef':'sf']/100;return{f,cx:zc(c[i?'ex':'sx'],f)/100*w,cy:zc(c[i?'ey':'sy'],f)/100*h,rw:f*w,rh:f*h}},A=R(0),B=R(1);

[1-a,a].forEach(i=>{const r=R(i),col=i?'#ff3b5c':'#22c55e',on=i==a;g.save();g.strokeStyle=col;g.fillStyle=col;g.lineWidth=on?4:2.5;g.setLineDash(on?[]:[10,6]);g.strokeRect(r.cx-r.rw/2,r.cy-r.rh/2,r.rw,r.rh);g.font='bold 24px system-ui';g.textBaseline='top';g.fillText(i?'End':'Start',r.cx-r.rw/2+8,r.cy-r.rh/2+6);if(on)g.fillRect(r.cx+r.rw/2-10,r.cy+r.rh/2-10,20,20);g.restore()})}
$('#ins').addEventListener('pointerdown',e=>{if(e.target.id!='zwc')return;const c=getSel();if(!c||!S.sel||S.sel.k!='clip'||c.za!=ZW)return;e.preventDefault();cw(c);const el=e.target,r=el.getBoundingClientRect(),P=ev=>[(ev.clientX-r.left)/r.width*100,(ev.clientY-r.top)/r.height*100],K=i=>i?['ex','ey','ef']:['sx','sy','sf'],G=i=>{const k=K(i),f=c[k[2]]/100;return{k,f,cx:zc(c[k[0]],f),cy:zc(c[k[1]],f)}};
