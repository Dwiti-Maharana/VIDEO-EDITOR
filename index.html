<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClipForge – Social Video Editor</title>
<style>
:root{--bg:#eceef5;--p:#fff;--p2:#eef0f7;--bd:#d5d9e6;--tx:#171a26;--mu:#666d86;--ac:#6d4aff;--ac2:#00c2a8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d15;--p:#141723;--p2:#1e2231;--bd:#2c3248;--tx:#e8eaf4;--mu:#8b91ab}}
:root[data-theme="dark"]{--bg:#0b0d15;--p:#141723;--p2:#1e2231;--bd:#2c3248;--tx:#e8eaf4;--mu:#8b91ab}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.pr{background:linear-gradient(135deg,var(--ac),#b04aff);border:0;color:#fff;font-weight:600}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--p);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.logo{font-weight:800;font-size:17px;letter-spacing:-.02em;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
#asp{display:flex;gap:6px;flex-wrap:wrap}#asp small{opacity:.75;margin-left:3px}
main{flex:1;min-height:0;display:grid;grid-template-columns:290px 1fr 270px}
aside{background:var(--p);overflow:auto;padding:10px}
#L{border-right:1px solid var(--bd)}#ins{border-left:1px solid var(--bd)}
#stage{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
canvas{border-radius:6px;box-shadow:0 12px 40px #0005;background:#000;touch-action:none}
.tabs{display:flex;gap:4px;margin-bottom:10px}.tabs button{flex:1;padding:6px 2px;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mi{position:relative;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:var(--p2);cursor:pointer;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center}
.mi img,.mi video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.mi b{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:500;padding:2px 5px;background:#000b;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .rm{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:#000c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;z-index:2;cursor:pointer}.mi .rm:hover{background:#e5384f}
.drop{border:2px dashed var(--bd);border-radius:10px;padding:16px;text-align:center;color:var(--mu);margin-bottom:10px;cursor:pointer}
.drop:hover{border-color:var(--ac);color:var(--tx)}
#tl{height:280px;background:var(--p);border-top:1px solid var(--bd);display:flex;flex-direction:column}
.tb{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.tb .sp{flex:1}.tb input[type=range]{width:100px}#tm{font-variant-numeric:tabular-nums;min-width:110px;color:var(--mu)}
.tw{flex:1;display:grid;grid-template-columns:92px 1fr;min-height:0}
.lb div{height:34px;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:11px;border-bottom:1px solid var(--bd)}
.lb div:first-child{height:24px}.lb div:nth-child(3){height:56px}
#sc{overflow:auto;position:relative}#in{position:relative;min-height:100%}
#rul{height:24px;position:relative;border-bottom:1px solid var(--bd);cursor:pointer;background:var(--p2)}
#rul span{position:absolute;top:5px;font-size:10px;color:var(--mu);padding-left:3px;border-left:1px solid var(--bd);height:19px}
.row{height:34px;position:relative;border-bottom:1px solid var(--bd)}.row.v{height:56px}
.blk{position:absolute;top:3px;bottom:3px;border-radius:6px;padding:4px 8px;overflow:hidden;white-space:nowrap;font-size:11px;color:#fff;cursor:grab;border:2px solid transparent;user-select:none}
.blk.sel{border-color:#fff;box-shadow:0 0 0 2px var(--ac)}
.blk.vid{background:#5a47e8}.blk.txt{background:#e0457b}.blk.mus{background:#0b9d88}
.blk .h{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize;background:#fff6}
#spd{background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:6px 4px}.spg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.spg button{padding:6px 0;font-size:12px}
#L,#L *{user-select:none;-webkit-user-select:none}#L textarea,#L input{user-select:text;-webkit-user-select:text}.mbar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.mbar button{flex:1;padding:6px 4px;font-size:12px;white-space:nowrap}.mi.ms{outline:3px solid var(--ac);outline-offset:-3px}.mi .ck{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:2}
.tc{display:flex;gap:4px}.tc b{cursor:pointer;font-weight:400;font-size:12px;line-height:1;padding:2px 4px;border-radius:4px}.tc b:hover{background:var(--p2)}.tc b.off{background:#e5384f40}
.lb div{flex-direction:column;gap:2px;line-height:1.1}
.blk{min-width:4px}
.blk .h.l{left:0;right:auto}.blk:hover .h{background:#fffb}.blk .lbl{position:relative;text-shadow:0 1px 2px #000c;font-weight:600;pointer-events:none}
#sn{position:absolute;top:0;bottom:0;width:1px;background:#ffd400;z-index:4;display:none;pointer-events:none}
#ph{position:absolute;top:0;bottom:0;width:2px;background:#ff3b5c;pointer-events:none;z-index:5}
#ph:before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:#ff3b5c}
label.f{display:block;margin:8px 0;color:var(--mu);font-size:12px}
label.f input[type=range]{width:100%;accent-color:var(--ac)}
label.f input:not([type=range]):not([type=checkbox]),label.f select,label.f textarea{width:100%;background:var(--p2);border:1px solid var(--bd);border-radius:6px;padding:5px}
label.f input[type=color]{height:30px;padding:2px}
label.f em{float:right;font-style:normal;color:var(--tx)}
h4{margin:14px 0 6px;font-size:12px;font-weight:700;color:var(--mu)}
.emo{display:flex;flex-wrap:wrap;gap:4px}.emo button{font-size:20px;padding:2px 6px}
.blk,#rul{touch-action:none;-webkit-touch-callout:none}
.row.a{height:48px}.lb div:nth-child(4),.lb div:nth-child(5){height:48px}.lb{overflow:hidden}
.wfa{position:absolute;left:0;top:0;width:100%;height:100%;opacity:.95;pointer-events:none}
.wfv{position:absolute;left:0;bottom:0;width:100%;height:50%;opacity:.95;pointer-events:none;background:linear-gradient(transparent,#0008)}
#in.mvmode .blk.sel{box-shadow:0 0 0 3px #ffd400,0 8px 20px #0008;filter:brightness(1.15);z-index:8}#sc{touch-action:pan-x pan-y}
.mq{position:absolute;border:1px solid var(--ac);background:#6d4aff30;z-index:6;pointer-events:none}
.mbn{background:var(--ac);color:#fff;border-radius:8px;padding:6px 8px;margin-bottom:8px;font-weight:600;font-size:12px}
#recui{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:12px;background:var(--p);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;box-shadow:0 10px 40px #0007}
#recui[hidden],#cd[hidden]{display:none}
.rdot{width:12px;height:12px;border-radius:50%;background:#ff3b5c;animation:pl 1s infinite;flex:none}
@keyframes pl{50%{opacity:.25;transform:scale(.7)}}
#rtm{font-size:22px;font-variant-numeric:tabular-nums;min-width:78px}
#rwv{width:min(300px,42vw);height:48px;background:var(--p2);border-radius:8px}
#cd{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:30vmin;font-weight:800;color:#fff;text-shadow:0 4px 40px #000;z-index:45;pointer-events:none;background:#0006}
#rb{position:absolute;background:#d98a00;border:2px solid #ff3b5c;border-radius:6px;z-index:3;overflow:hidden;pointer-events:none}
#sc{overscroll-behavior:contain}
#mb{display:none}
@media(pointer:coarse){#rul{height:34px}.lb div:first-child{height:34px}#rul span{top:9px}.blk:not(.sel) .h{display:none}.blk .h{width:22px}button{min-height:36px}.blk .h{width:18px}input[type=range]{height:28px}label.f input[type=checkbox]{width:20px;height:20px;vertical-align:middle}.tc b{padding:6px 8px;font-size:15px}}
@media(max-width:900px){
body{overflow:hidden;height:100vh;height:100dvh}
header{padding:6px 10px;gap:6px;flex-wrap:nowrap}
#asp{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}#asp button{white-space:nowrap;padding:5px 9px;flex:none}#asp small{display:none}
header>span[style]{display:none}.logo{font-size:15px;flex:none}#th,#ex{flex:none;white-space:nowrap}
main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
aside{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#L,#ins{position:fixed;left:0;right:0;bottom:calc(52px + env(safe-area-inset-bottom,0px));max-height:48vh;max-height:48dvh;border:0;border-top:1px solid var(--bd);border-radius:14px 14px 0 0;box-shadow:0 -8px 30px #0006;z-index:20;transform:translateY(120%);visibility:hidden;transition:transform .2s,visibility .2s}
#L.open,#ins.open{transform:none;visibility:visible}
#tl{height:250px;flex:none}
.tb{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:4px 8px}.tb>*{flex:none}.tb input[type=range]{width:80px}#tm{min-width:92px;font-size:12px}
.tw{grid-template-columns:64px 1fr}.lb div{font-size:10px}
label.f input:not([type=range]):not([type=checkbox]),label.f select,label.f textarea{font-size:16px}
#mb{display:flex;gap:8px;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));height:calc(52px + env(safe-area-inset-bottom,0px));background:var(--p);border-top:1px solid var(--bd);z-index:21;flex:none}
#mb button{flex:1;font-weight:600}#mb button.has{border-color:var(--ac2)}
}
@media(max-width:900px) and (max-height:500px){#tl{height:150px}}
</style></head><body>
<header><span class="logo">◆ ClipForge</span><div id="asp"></div><span style="flex:1"></span>
<button id="th" title="Toggle theme">◐</button><button class="pr" id="ex">⬇ Export video</button></header>
<main>
<aside id="L"><div class="tabs"><button data-t="media">Media</button><button data-t="text">Text</button><button data-t="fx">Effects</button><button data-t="audio">Audio</button></div><div id="pane"></div></aside>
<div id="stage"><canvas id="cv"></canvas></div>
<aside id="ins"></aside>
</main>
<section id="tl">
<div class="tb"><button id="st" title="Go to start">⏮</button><button id="pp" class="pr" title="Play / pause (Space)">▶</button><span id="tm">0:00.0 / 0:00.0</span>
<button id="sp" title="Split at playhead (S)">✂ Split</button><button id="du" title="Duplicate">⧉</button><button id="ml" title="Move earlier">◀</button><button id="mr" title="Move later">▶</button><select id="spd" title="Speed of selected clip (slow motion / fast forward)"><option value="0.1">🐢 0.1×</option><option value="0.25">🐢 0.25×</option><option value="0.5">🐢 0.5×</option><option value="0.75">0.75×</option><option value="1" selected>⏱ 1× normal</option><option value="1.25">1.25×</option><option value="1.5">🐇 1.5×</option><option value="2">🐇 2×</option><option value="3">🐇 3×</option><option value="4">🐇 4×</option><option value="6">🐇 6×</option><option value="8">🐇 8×</option><option value="" id="spc" hidden></option></select><button id="de" title="Delete (Del)">🗑 Delete</button><button id="un" title="Undo (Ctrl+Z)">↶ Undo</button><button id="re" title="Redo (Ctrl+Y)">↷</button><button id="snb" class="on" title="Magnetic snapping to playhead and clip edges">🧲 Snap</button><button id="mm" title="Select multiple clips: Ctrl/Shift-click, drag a box, or tap this then tap clips">☑ Multi</button>
<span class="sp"></span><button id="zo" title="Zoom out">−</button><input type="range" id="zm" min="0" max="1000" value="575" title="Timeline zoom (Ctrl + scroll)"><button id="zi" title="Zoom in">+</button><button id="zf" title="Fit whole timeline">Fit</button></div>
<div class="tw"><div class="lb"><div></div><div>Text<span class="tc"><b data-tg="Th" title="Hide / show all text"></b></span></div><div>Video<span class="tc"><b data-tg="Vh" title="Hide / show video"></b><b data-tg="Vm" title="Mute / unmute video sound"></b></span></div><div>Voice<span class="tc"><b data-tg="Am" title="Mute / unmute voice track"></b></span></div><div>Music<span class="tc"><b data-tg="Mm" title="Mute / unmute music track"></b></span></div></div>
<div id="sc"><div id="in"><div id="rul"></div><div class="row" id="rT"></div><div class="row v" id="rV"></div><div class="row a" id="rA"></div><div class="row a" id="rM"></div><div id="sn"></div><div id="ph"></div></div></div></div>
</section>
<nav id="mb"><button data-sh="L">＋ Add</button><button data-sh="ins">✎ Edit</button></nav>
<div id="recui" hidden><span class="rdot"></span><b id="rtm">0:00.0</b><canvas id="rwv" width="300" height="48"></canvas><button class="pr" id="rstop">■ Stop</button></div><div id="cd" hidden></div><input type="file" id="fi" accept="video/*,image/*,audio/*" multiple hidden>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d');
const S={media:[],clips:[],texts:[],voices:[],music:null,t:0,play:false,sel:null,zoom:60,id:1,tab:'media',curId:null,last:0,multi:[],mm:0};
const ASP={'9:16':[720,1280],'4:5':[720,900],'1:1':[720,720],'16:9':[1280,720]};
const LBL={'9:16':'TikTok · Reels · Shorts','4:5':'Instagram post','1:1':'Square','16:9':'YouTube'};
const DEF={b:100,c:100,s:100,bl:0,g:0,se:0,h:0};
const FX={Original:{},Vivid:{c:115,s:145},'B&W':{g:100,c:110},Vintage:{se:60,c:90,b:105,h:-10},Cool:{h:-20,s:110,b:105},Warm:{h:15,se:25,s:115},Fade:{c:80,b:110,s:80},Dramatic:{c:145,b:90,s:110},Dream:{bl:2,b:112,s:125}};
const TP={'Plain text':{},Title:{size:96,anim:'pop',y:30},Caption:{size:52,bgOn:1,y:80},Subtitle:{size:44,bold:0,y:88,stroke:1},Neon:{size:80,color:'#00ffd5',stroke:1,anim:'fade'},Impact:{size:110,font:'Impact',stroke:1,color:'#ffe600',y:20}};
const FONTS=['Arial','Impact','Georgia','Courier New','Comic Sans MS','Trebuchet MS'];
const EMO='😀 😂 😍 🔥 💯 ❤️ 👍 🎉 ✨ ⭐ 💥 👀 🚀 😎 🙌 🎵'.split(' ');
let W,H,AC,DEST,REC=null,VN=0;
const ALL={},HS={u:[],r:[],cur:''};let HT;
const snap=()=>JSON.stringify({c:S.clips,t:S.texts,v:S.voices,mu:S.music,md:S.media.map(m=>m.id)},(k,v)=>k=='_b'?undefined:v);
function hist(){const s=snap();if(s!==HS.cur){if(HS.cur)HS.u.push(HS.cur);if(HS.u.length>100)HS.u.shift();HS.r=[];HS.cur=s;save()}}const INS={o:null};
const M=id=>S.media.find(m=>m.id==id),esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>{t=Math.max(0,t);return Math.floor(t/60)+':'+(t%60).toFixed(1).padStart(4,'0')};
const total=()=>Math.max(0,S.clips.reduce((a,c)=>a+c.dur,0),...S.voices.map(a=>a.start+adur(a)),...S.texts.map(x=>x.start+x.dur));
const active=t=>S.clips.find(c=>t>=c.start&&t<c.start+c.dur);
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;bottom:270px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:8px 14px;border-radius:8px;z-index:99';document.body.append(d);setTimeout(()=>d.remove(),2400)}
function setAsp(k){S.asp=k;save();[W,H]=ASP[k];cv.width=W;cv.height=H;fit();$('#asp').innerHTML=Object.keys(ASP).map(a=>`<button class="${a==k?'on':''}" data-a="${a}">${a}<small>${LBL[a]}</small></button>`).join('')}
function fit(){const r=$('#stage').getBoundingClientRect(),k=Math.min((r.width-24)/W,(r.height-24)/H);if(k>0){cv.style.width=W*k+'px';cv.style.height=H*k+'px'}}
new ResizeObserver(fit).observe($('#stage'));
$('#asp').onclick=e=>{const b=e.target.closest('[data-a]');b&&setAsp(b.dataset.a)};
$('#th').onclick=()=>{const d=document.documentElement,c=d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');d.dataset.theme=c=='dark'?'light':'dark';try{localStorage.setItem('cf-theme',d.dataset.theme)}catch(x){}};
try{const t0=localStorage.getItem('cf-theme');if(t0)document.documentElement.dataset.theme=t0}catch(x){}

/* ---------- media ---------- */
function route(m){if(m.type=='image'||m.node||!m.el)return;AC=AC||new AudioContext();DEST=DEST||AC.createMediaStreamDestination();m.node=AC.createMediaElementSource(m.el);m.node.connect(DEST);m.node.connect(AC.destination)}
function addFiles(fs){for(const f of fs){const url=URL.createObjectURL(f),type=f.type.startsWith('video')?'video':f.type.startsWith('image')?'image':f.type.startsWith('audio')?'audio':null;if(!type)continue;
const m={id:S.id++,name:f.name,url,type,file:f};
if(type=='image'){const i=new Image();i.onload=()=>{m.el=i;m.w=i.width;m.h=i.height;m.dur=5;ALL[m.id]=m;S.media.push(m);hist();renderPane()};i.src=url}
else{const e=document.createElement(type);e.preload='auto';e.playsInline=true;e.src=url;e.onloadedmetadata=()=>{m.el=e;m.dur=e.duration;m.w=e.videoWidth;m.h=e.videoHeight;route(m);ALL[m.id]=m;S.media.push(m);hist();renderPane();if(type=='video'){thumb(m);peaks(m)}if(type=='audio')peaks(m)}}}}
$('#fi').onchange=e=>{addFiles(e.target.files);e.target.value=''};
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();addFiles(e.dataTransfer.files)});
function layout(){let t=0;S.clips.forEach(c=>{c.dur=(c.out-c.in)/c.sp;c.start=t;t+=c.dur})}
function addClip(m){const c={id:S.id++,mid:m.id,in:0,out:m.dur,sp:1,vol:1,fit:'cover',zoom:1,rot:0,flip:0,fade:0,za:'None',zs:30,...DEF};S.clips.push(c);layout();pick('clip',c.id)}
function rmMedia(id,q){const m=M(id);if(!m)return;if(m.type!='image')m.el.pause();S.clips=S.clips.filter(c=>c.mid!=id);S.voices=S.voices.filter(v=>v.mid!=id);if(S.music&&S.music.mid==id)S.music=null;S.media=S.media.filter(x=>x.id!=id);layout();S.t=Math.min(S.t,total());S.curId=null;pick(null);renderPane();q||toast('Removed '+m.name)}
function setMusic(m){const a={id:S.id++,mid:m.id,start:S.t,in:0,out:m.dur,vol:.8,sp:1,fi:0,fo:0,mute:0,tr:'m'};S.voices.push(a);pick('voice',a.id)}
function _unusedMusic(m){S.music={mid:m.id,vol:.8};pick('music',0)}
function addText(p={}){const o={id:S.id++,txt:'Your text',font:'Arial',size:64,color:'#ffffff',bold:1,stroke:0,bgOn:0,bgc:'#000000',anim:'none',start:S.t,dur:3,x:50,y:50,...p};S.texts.push(o);pick('text',o.id)}
const getSel=()=>{const s=S.sel;return s&&(s.k=='clip'?S.clips.find(c=>c.id==s.id):s.k=='text'?S.texts.find(c=>c.id==s.id):s.k=='voice'?S.voices.find(c=>c.id==s.id):S.music)};
function pick(k,id,add){if(!k){S.sel=null;S.multi=[]}else if(add){const key=k+':'+id;if(S.multi.includes(key)&&S.multi.length>1){S.multi=S.multi.filter(x=>x!=key);const l=S.multi[S.multi.length-1].split(':');S.sel={k:l[0],id:+l[1]}}else{if(!S.multi.includes(key))S.multi.push(key);S.sel={k,id}}}else{S.sel={k,id};S.multi=[k+':'+id]}hist();renderIns();renderTL();const eb=document.querySelector('#mb [data-sh=ins]');eb&&eb.classList.toggle('has',!!S.sel);updMM()}
const mob=()=>matchMedia('(max-width:900px)').matches;

let st;try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){return toast('Microphone blocked. Allow mic access, or open the editor in its own browser tab.')}
const me=REC={cd:1,st},cd=$('#cd');
for(let n=3;n>0;n--){if(REC!==me)return;cd.textContent=n;cd.hidden=false;await new Promise(r=>setTimeout(r,700))}
cd.hidden=true;if(REC!==me)return;
const mr=new MediaRecorder(st),ch=[],at=S.t,t0=performance.now();mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());const bl=new Blob(ch,{type:mr.mimeType}),el=new Audio(URL.createObjectURL(bl)),meas=(performance.now()-t0)/1000,m={id:S.id++,name:'Voice-over '+(++VN),url:el.src,type:'audio',file:bl};
let done=0;const fin=()=>{if(done)return;done=1;el.currentTime=0;m.el=el;m.dur=isFinite(el.duration)?el.duration:meas;route(m);ALL[m.id]=m;S.media.push(m);peaks(m);const v={id:S.id++,mid:m.id,start:at,in:0,out:m.dur,vol:1,sp:1,fi:0,fo:0,mute:0,tr:'v'};S.voices.push(v);pick('voice',v.id);renderPane();toast('Voice-over added to the timeline')};
el.onloadedmetadata=()=>{if(isFinite(el.duration))fin();else{el.addEventListener('timeupdate',fin,{once:true});el.currentTime=1e101}}};
let actx=null,an=null;try{actx=new AudioContext();an=actx.createAnalyser();an.fftSize=512;actx.createMediaStreamSource(st).connect(an)}catch(e){actx=an=null}
REC={mr,t0,at,an,actx,buf:an?new Uint8Array(an.fftSize):null,pk:[],bars:[],ls:0};$('#recui').hidden=false;mr.start();if(total()>0&&at<total()-.05)play()}
function recStop(){if(!REC)return;const r=REC;REC=null;$('#recui').hidden=true;$('#cd').hidden=true;const rb=$('#rb');rb&&rb.remove();if($('#rc'))$('#rc').textContent='● Record voice-over';
if(r.cd){r.st.getTracks().forEach(t=>t.stop());return}
try{r.actx&&r.actx.close()}catch(e){}r.mr.stop();if(S.play)pause()}
$('#rstop').onclick=recStop;
function wfA(pk){const n=Math.max(2,pk.length);let d='';for(let i=0;i<pk.length;i++){const hh=Math.max(.35,pk[i]*9.5);d+=`M${i} ${10-hh}v${2*hh}`}return`<svg class="wfa" viewBox="0 0 ${n} 20" preserveAspectRatio="none"><path d="${d}" stroke="#fff" stroke-width=".85" fill="none"/></svg>`}
function recTick(){const r=REC;if(!r||!r.mr)return;const el=(performance.now()-r.t0)/1000;if(!S.play)S.t=r.at+el;
if(r.an){r.an.getByteTimeDomainData(r.buf);let m=0;for(let i=0;i<r.buf.length;i++)m=Math.max(m,Math.abs(r.buf[i]-128));const a=Math.min(1,Math.pow(m/128,.6)*1.4);r.bars.push(a);if(r.bars.length>80)r.bars.shift();if(el-r.ls>=.05){r.ls=el;r.pk.push(a)}}
$('#rtm').textContent=fmt(el);
const c2=$('#rwv').getContext('2d'),w=300,hh=48,n=80,bw=w/n;c2.clearRect(0,0,w,hh);c2.fillStyle='#ff3b5c';
for(let i=0;i<r.bars.length;i++){const bh=Math.max(2,r.bars[i]*hh*.92),x=(n-r.bars.length+i)*bw;c2.globalAlpha=.35+.65*(i/r.bars.length);c2.fillRect(x+1,(hh-bh)/2,Math.max(1,bw-2),bh)}c2.globalAlpha=1;
let rb=$('#rb');if(!rb){rb=document.createElement('div');rb.id='rb';$('#in').append(rb)}
const z=S.zoom,need=(r.at+el+6)*z;if(parseFloat($('#in').style.width)<need)$('#in').style.width=need+'px';
rb.style.cssText=`left:${r.at*z}px;width:${Math.max(3,el*z)}px;top:${$('#rA').offsetTop}px;height:${$('#rA').offsetHeight}px`;
rb.innerHTML=wfA(r.pk)+'<span style="position:relative;display:block;padding:4px 8px;color:#fff;font-size:11px;font-weight:600;text-shadow:0 1px 2px #000c">🎙 Recording…</span>'}
/* ---------- touch gestures: swipe clip = scroll, long-press = move, pinch = zoom ---------- */
const bdrag=(e,fn,end)=>e.pointerType=='touch'?touchDrag(e,fn,end):drag(e,fn,end);
function touchDrag(e,fn,end){const sx=e.clientX,sy=e.clientY,sc=$('#sc'),sl=sc.scrollLeft,st=sc.scrollTop,id=e.pointerId;let mode=0;
const tm=setTimeout(()=>{if(!mode&&!S.pinch){mode=2;$('#in').classList.add('mvmode');try{navigator.vibrate&&navigator.vibrate(18)}catch(x){}toast('Move mode: drag the clip')}},380);
const mv=ev=>{if(ev.pointerId!=id||S.pinch)return;const dx=ev.clientX-sx,dy=ev.clientY-sy;if(!mode&&Math.hypot(dx,dy)>8){mode=1;clearTimeout(tm)}if(mode==1){sc.scrollLeft=sl-dx;sc.scrollTop=st-dy}else if(mode==2)fn(dx,ev)};
const up=ev=>{if(ev.pointerId!=id)return;clearTimeout(tm);removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);$('#in').classList.remove('mvmode');if(mode==2){end&&end();hist()}};
addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)}
let PZ=null;const SCe=$('#sc');
const pinchMove=e=>{if(PZ&&e.touches.length==2){e.preventDefault();const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);setZoom(PZ.z*d/PZ.d,(a.clientX+b.clientX)/2-SCe.getBoundingClientRect().left)}};
const pinchEnd=e=>{if(e.touches.length<2&&PZ){PZ=null;setTimeout(()=>{S.pinch=0},200)}};
SCe.addEventListener('touchstart',e=>{const t=e.target;t.addEventListener('touchmove',pinchMove,{passive:false});t.addEventListener('touchend',pinchEnd);t.addEventListener('touchcancel',pinchEnd);
if(e.touches.length==2){const a=e.touches[0],b=e.touches[1];PZ={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1,z:S.zoom};S.pinch=1}},{passive:true});
/* ---------- multi-select (Filmora-style) ---------- */
const isM=(k,id)=>S.multi.includes(k+':'+id);
const selObjs=kind=>S.multi.map(s=>s.split(':')).filter(p=>p[0]==kind).map(p=>(kind=='clip'?S.clips:kind=='text'?S.texts:S.voices).find(x=>x.id==p[1])).filter(Boolean);
function updMM(){const b=$('#mm');if(b){b.classList.toggle('on',!!S.mm);b.textContent='☑ Multi'+(S.multi.length>1?' ('+S.multi.length+')':'')}}
function selSet(keys){S.multi=keys;const l=keys[keys.length-1].split(':');S.sel={k:l[0],id:+l[1]};hist();renderIns();renderTL();updMM()}
function selAll(){const k=[...S.clips.map(c=>'clip:'+c.id),...S.texts.map(c=>'text:'+c.id),...S.voices.map(c=>'voice:'+c.id)];if(k.length)selSet(k)}
$('#mm').onclick=()=>{S.mm=!S.mm;updMM();if(S.mm)toast('Tap clips to select several')};
$('#sc').addEventListener('scroll',()=>{$('.lb').scrollTop=$('#sc').scrollTop});
function groupShift(e,o,fin){const items=[...selObjs('text'),...selObjs('voice')],s0=items.map(x=>x.start),mn=Math.min(...s0),z=S.zoom;bdrag(e,dx=>{const d=Math.max(-mn,dx/z);items.forEach((x,i)=>{x.start=s0[i]+d});renderTL()},fin)}
function marquee(e){const box=$('#in'),r0=box.getBoundingClientRect(),base=(e.ctrlKey||e.metaKey||e.shiftKey)?[...S.multi]:[],mq=document.createElement('div'),x0=e.clientX,y0=e.clientY;let hit=[];mq.className='mq';box.append(mq);
drag(e,(d,ev)=>{const x1=Math.min(x0,ev.clientX),x2=Math.max(x0,ev.clientX),y1=Math.min(y0,ev.clientY),y2=Math.max(y0,ev.clientY);mq.style.cssText=`left:${x1-r0.left}px;top:${y1-r0.top}px;width:${x2-x1}px;height:${y2-y1}px`;hit=[];
box.querySelectorAll('.blk').forEach(b=>{const q=b.getBoundingClientRect(),on=q.right>=x1&&q.left<=x2&&q.bottom>=y1&&q.top<=y2,key=b.dataset.k+':'+b.dataset.id;if(on&&b.dataset.k!='music')hit.push(key);b.classList.toggle('sel',on||base.includes(key))})},
()=>{mq.remove();const all=[...new Set([...base,...hit])];if(all.length){const l=all[all.length-1].split(':');S.multi=all;S.sel={k:l[0],id:+l[1]}}renderIns();renderTL();updMM()})}
function splitMulti(){const keys=[];
selObjs('clip').forEach(c=>{if(S.t>c.start+.1&&S.t<c.start+c.dur-.1){const rel=(S.t-c.start)*c.sp,n={...c,id:S.id++,in:c.in+rel};c.out=c.in+rel;S.clips.splice(S.clips.indexOf(c)+1,0,n);layout();keys.push('clip:'+n.id)}});
selObjs('voice').forEach(a=>{const d=adur(a),r=S.t-a.start;if(r>.1&&r<d-.1){const cut=a.in+r*a.sp,n={...a,id:S.id++,start:S.t,in:cut};a.out=cut;a.fo=0;n.fi=0;S.voices.splice(S.voices.indexOf(a)+1,0,n);keys.push('voice:'+n.id)}});
selObjs('text').forEach(x=>{const r=S.t-x.start;if(r>.1&&r<x.dur-.1){const n={...x,id:S.id++,start:S.t,dur:x.dur-r,anim:'none'};x.dur=r;S.texts.push(n);keys.push('text:'+n.id)}});

function dupMulti(){const keys=[];
selObjs('clip').forEach(c=>{const n={...c,id:S.id++};S.clips.splice(S.clips.indexOf(c)+1,0,n);keys.push('clip:'+n.id)});layout();
selObjs('voice').forEach(a=>{const n={...a,id:S.id++,start:a.start+adur(a)};S.voices.splice(S.voices.indexOf(a)+1,0,n);keys.push('voice:'+n.id)});

function mvMulti(d){selObjs('voice').concat(selObjs('text')).forEach(a=>{a.start=Math.max(0,+(a.start+d*.1).toFixed(2))});
const sc=new Set(selObjs('clip')),arr=S.clips;
if(d<0){for(let i=1;i<arr.length;i++)if(sc.has(arr[i])&&!sc.has(arr[i-1]))[arr[i-1],arr[i]]=[arr[i],arr[i-1]]}
else{for(let i=arr.length-2;i>=0;i--)if(sc.has(arr[i])&&!sc.has(arr[i+1]))[arr[i+1],arr[i]]=[arr[i],arr[i+1]]}

/* ---------- auto-save (IndexedDB: media files + project state) ---------- */
const DB={db:null};let DIRTY=0,ST=0,SAVING=0;
const idb=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const txp=(st,fn)=>new Promise((ok,no)=>{const t=DB.db.transaction(st,'readwrite');fn(t);t.oncomplete=ok;t.onerror=t.onabort=()=>no(t.error||new Error('tx'))});
function save(){DIRTY=1;clearTimeout(ST);ST=setTimeout(doSave,400)}
const stateStr=()=>JSON.stringify({c:S.clips,t:S.texts,v:S.voices,md:S.media.map(m=>m.id),asp:S.asp,zoom:S.zoom,snap:S.snap,trk:S.trk,tab:S.tab,pos:S.t,id:S.id,sel:S.sel},(k,v)=>k=='_b'?undefined:v);
async function doSave(){if(!DB.db||!S.ready)return;if(SAVING){DIRTY=1;return}if(!DIRTY)return;DIRTY=0;SAVING=1;
try{const keep=new Set();S.media.forEach(m=>{keep.add(m.id);m.ref&&keep.add(m.ref)});
const add=S.media.filter(m=>!m.saved);
if(add.length){add.forEach(m=>m.saved=1);try{await txp('media',t=>add.forEach(m=>t.objectStore('media').put({id:m.id,name:m.name,type:m.type,dur:m.dur,w:m.w||0,h:m.h||0,ref:m.ref||null,blob:m.ref?null:m.file})))}catch(e){add.forEach(m=>m.saved=0);if(!S.warned){S.warned=1;toast('Not enough browser storage to keep these files after refresh')}}}
const keys=await idb(DB.db.transaction('media').objectStore('media').getAllKeys()),del=keys.filter(k=>!keep.has(k));
if(del.length){await txp('media',t=>del.forEach(k=>t.objectStore('media').delete(k)));del.forEach(k=>ALL[k]&&(ALL[k].saved=0))}
await txp('kv',t=>t.objectStore('kv').put(stateStr(),'state'))}catch(e){}
SAVING=0;if(DIRTY)save()}
addEventListener('pagehide',()=>{DIRTY=1;doSave()});document.addEventListener('visibilitychange',()=>{if(document.hidden){DIRTY=1;doSave()}});
async function restoreProject(){try{
await new Promise((ok,no)=>{const r=indexedDB.open('clipforge',1);r.onupgradeneeded=()=>{r.result.createObjectStore('media',{keyPath:'id'});r.result.createObjectStore('kv')};r.onsuccess=()=>{DB.db=r.result;ok()};r.onerror=()=>no(r.error)});
const raw=await idb(DB.db.transaction('kv').objectStore('kv').get('state'));if(!raw){S.ready=1;return}
const recs=await idb(DB.db.transaction('media').objectStore('media').getAll()),by=new Map(recs.map(r=>[r.id,r])),st=JSON.parse(raw);
const load=id=>new Promise(res=>{const r=by.get(id);if(!r)return res(null);const blob=r.blob||(by.get(r.ref)||{}).blob;if(!blob)return res(null);
const m={id,name:r.name,type:r.type,file:blob,url:URL.createObjectURL(blob),dur:r.dur,w:r.w,h:r.h,ref:r.ref,saved:1};
if(m.type=='image'){const i=new Image();i.onload=()=>{m.el=i;m.w=i.width;m.h=i.height;res(m)};i.onerror=()=>res(null);i.src=m.url;return}
const e=document.createElement(m.type);e.preload='auto';e.playsInline=true;let done=0;
const fin=ok=>{if(done)return;done=1;if(!ok)return res(null);m.el=e;if(isFinite(e.duration)&&e.duration>0)m.dur=e.duration;m.w=e.videoWidth||m.w;m.h=e.videoHeight||m.h;res(m)};
e.onloadedmetadata=()=>fin(1);e.onerror=()=>fin(0);e.src=m.url;setTimeout(()=>fin(m.dur>0),4000)});
const ms=(await Promise.all(st.md.map(load))).filter(Boolean);
ms.forEach(m=>{ALL[m.id]=m;try{route(m)}catch(x){}});S.media=ms;
S.clips=st.c.filter(c=>M(c.mid));S.texts=st.t||[];S.voices=st.v.filter(a=>M(a.mid));S.music=null;
S.id=Math.max(S.id,st.id||1);S.zoom=st.zoom||S.zoom;S.snap=st.snap?1:0;Object.assign(S.trk,st.trk||{});S.tab=st.tab||'media';
if(st.asp&&ASP[st.asp])setAsp(st.asp);
layout();S.t=Math.min(st.pos||0,total());S.curId=null;S.sel=st.sel||null;if(!getSel())S.sel=null;S.multi=S.sel?[S.sel.k+':'+S.sel.id]:[];
$('#zm').value=Math.round(250*Math.log10(S.zoom/ZMIN));$('#snb').classList.toggle('on',!!S.snap);trkUI();
ms.forEach(m=>{if(m.type=='video'){thumb(m);peaks(m)}else if(m.type=='audio')peaks(m)});
HS.cur=snap();HS.u=[];HS.r=[];renderPane();renderIns();renderTL();
const eb=document.querySelector('#mb [data-sh=ins]');eb&&eb.classList.toggle('has',!!S.sel);
S.ready=1;save();if(ms.length||S.texts.length)toast('Project restored')
}catch(e){console.warn('ClipForge restore failed',e);if(DB.db&&!S.ready)toast('Could not restore the saved project')}}
HS.cur=snap();trkUI();setAsp('9:16');renderPane();renderIns();renderTL();requestAnimationFrame(frame);restoreProject();
